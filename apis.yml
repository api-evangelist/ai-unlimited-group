aid: ai-unlimited-group
name: AI Unlimited Group
description: 'AI Unlimited Group, Inc. (OTC: AIUG) is a West Hollywood, California fintech
  holding company founded in 2022 as Lever Global Corporation and renamed in July 2024. It
  markets four consumer-facing, AI-branded platforms — Lever App (student-loan and consumer-debt
  management), Nest Egg (self-directed investing, via the Nest Egg Securities broker-dealer),
  Travl.App (travel planning and savings) and Resolve Debt (accounts receivable). All four are
  end-user mobile and web products; the company operates no developer program, publishes no API
  reference, and ships no machine-readable contract. As of September 2026 its corporate domain
  aiug.ai serves a GoDaddy parking lander and the Lever App backend host api.lever.app returns
  HTTP 503 with x-render-routing: suspend, leaving travl.app as the only live company property.'
